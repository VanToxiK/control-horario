# Compila el APK de Mi Fichaje cada vez que se suben cambios y lo publica en «Releases».
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar la app web dentro del proyecto Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk MiFichaje.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mi Fichaje 1.0.${{ github.run_number }}
          body: Descarga MiFichaje.apk e instálalo en el móvil.
          files: MiFichaje.apk
          make_latest: true
